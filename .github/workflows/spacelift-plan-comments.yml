name: Test Spacelift plan comments action

on:
  pull_request:
    paths:
      - spacelift-plan-comments/**
      - .github/workflows/spacelift-plan-comments.yml
  push:
    branches: [main]
    paths:
      - spacelift-plan-comments/**
      - .github/workflows/spacelift-plan-comments.yml

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test spacelift-plan-comments/index.test.cjs
