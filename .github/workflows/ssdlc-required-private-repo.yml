# This branch exists only to host the file below while
# https://github.com/mozilla/ssdlc-actions/pull/<N> is in review. An org ruleset
# can only reference a workflow in a repo in the same org, so the entrypoint
# cannot be sourced from a personal fork -- tf-actions is standing in as a
# same-org, public host. The org ruleset that consumes it is defined in
# global-platform-admin at github/tf/mozilla/ssdlc.tf.
